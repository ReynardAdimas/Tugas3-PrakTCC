runtime: nodejs20 

env: standard 

instance_class: F1 

handlers: 
  - url: /assets 
    static_dir: dist/assets 

  - url: /favicon.ico 
    static_files: dist/favicon.ico 
    upload: dist/favicon.ico 

  - url: /.* 
    static_files: dist/index.html 
    upload: dist/index.html 

automatic_scaling: 
  min_instances: 0 
  max_instances: 2